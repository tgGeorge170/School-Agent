[triggers]
# Every 5 minutes; the worker converts to Europe/Sarajevo time itself (DST-safe)
# and only sends what's due. 288 KV list ops/day, well under the free 1000.
crons = ["*/5 * * * *"]

# Professor accounts and lessons. The deploy workflow creates the database and
# fills in database_id; the Worker creates its tables on first use.
[[d1_databases]]
binding = "DB"
database_name = "school-agent"
database_id = "REPLACED_BY_DEPLOY"
