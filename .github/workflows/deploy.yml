name: Deploy push worker

# The app itself is deployed by Cloudflare Pages' GitHub integration; this
# only tests and deploys the school-agent-push Worker.
on:
  push:
    branches: [claude/notifications-problem-analysis-3nc0cb]
    paths: ["worker/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fe89fdf1a9c3a41592051a8c0a0fca28
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy
