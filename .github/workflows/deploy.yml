name: Deploy workers

# The app itself is deployed by Cloudflare Pages' GitHub integration; this
# tests and deploys the two Workers: school-agent-push and school-agent-api.
on:
  push:
    branches: [main]
    paths: ["worker/**", "api/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: fe89fdf1a9c3a41592051a8c0a0fca28

jobs:
  push-worker:
    runs-on: ubuntu-latest
    concurrency: deploy-worker
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy

  api-worker:
    runs-on: ubuntu-latest
    concurrency: deploy-api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Create the D1 database if missing
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          find_id() { npx -y wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="school-agent");console.log(db?db.uuid:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx -y wrangler@4 d1 create school-agent; id=$(find_id); fi
          test -n "$id"
          sed -i "s/REPLACED_BY_DEPLOY/$id/" wrangler.toml
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy
