name: Deploy

on:
  push:
    branches: [claude/notifications-problem-analysis-3nc0cb]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Check Cloudflare access
        run: |
          echo "token set: ${{ env.CLOUDFLARE_API_TOKEN != '' }}, account id set: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' }}"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID
          npx -y wrangler@4 whoami
          npx -y wrangler@4 pages project list || true
